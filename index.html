<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LIBRAS VR - MVP</title>
  <style>
    :root {
      --avatar-width: 240px;
      --avatar-height: 320px;
      --avatar-zoom: 1;
      --avatar-pan-y: 0%;
      --avatar-filter: none;
    }

    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    * { box-sizing: border-box; }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      background: #000;
    }

    .eye {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .eye video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #stage.mono #eyeLeft { width: 100%; }
    #stage.mono #eyeRight { display: none; }

    #stage.stereo #eyeLeft,
    #stage.stereo #eyeRight {
      width: 50%;
      border-left: 1px solid #000;
    }

    button {
      font-family: system-ui, sans-serif;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: rgba(25, 25, 30, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }

    button.toggle-off {
      background: rgba(25, 25, 30, 0.35);
      color: rgba(255,255,255,0.45);
    }

    #micBtn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 40;
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 20px;
      background: linear-gradient(145deg, #ff6b6b, #e63946);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 18px rgba(230,57,70,0.45);
    }
    #micBtn.listening {
      background: linear-gradient(145deg, #3ddfc6, #2a9d8f);
      box-shadow: 0 4px 18px rgba(42,157,143,0.45);
    }

    #status {
      position: fixed;
      top: 20px;
      left: 72px;
      z-index: 30;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      background: rgba(25,25,30,0.5);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 999px;
      max-width: 50vw;
    }
    #status.offline {
      background: rgba(180, 60, 20, 0.65);
    }

    #controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    #vlibras-container {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 25;
      width: var(--avatar-width);
      height: var(--avatar-height);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      filter: var(--avatar-filter);
      transition: opacity 0.15s ease;
    }
    #vlibras-container canvas {
      width: 100% !important;
      height: 100% !important;
      transform: scale(var(--avatar-zoom)) translateY(var(--avatar-pan-y));
      transform-origin:center;
    }
    #vlibras-container.hidden { display: none; }

    #vlibras-fonte {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      user-select: text;
    }

    /* Botão "VLibras" desligado: esconde o avatar e o botão azul do widget */
    body.vlibras-off #vlibras-app-root,
    body.vlibras-off #vlibras-access-wrapper {
      display: none !important;
    }


    /* Avatar do VLibras copiado para cada olho (modo VR) */
    .avatar-box {
      position: absolute;
      right: 0;
      bottom: 0;
      height: min(46vh, 230px);
      aspect-ratio: var(--ar, 3 / 4);
      display: none;
      z-index: 5;
    }
    .avatar-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); /* contorno para destacar sobre a câmera */
    }
    body.avatar-espelhado .avatar-box { display: block; }
    .avatar-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #223;
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
    }
    body.avatar-pronto .avatar-msg { display: none; }
    body.vlibras-off .avatar-box { display: none !important; }

    /* Modo direto (plano B): mostra o painel original do VLibras */
    body.avatar-direto .avatar-box { display: none !important; }
    body.avatar-direto #vlibras-app-root {
      z-index: 2147483000 !important;
      pointer-events: auto !important;
    }

    /* Linha de diagnóstico (só aparece com ?debug no endereço) */
    #diag {
      position: fixed;
      top: 92px;
      left: 12px;
      z-index: 30;
      max-width: 46vw;
      color: rgba(255,255,255,0.75);
      font-family: system-ui, sans-serif;
      font-size: 10px;
      text-shadow: 0 1px 3px #000;
      white-space: pre-line;
      pointer-events: none;
    }

    /* O painel original do VLibras precisa continuar sendo "pintado" pelo
       navegador (senão no celular o avatar para de desenhar e a cópia sai em
       branco). Por isso ele fica ATRÁS da câmera, em vez de invisível. */
    #vlibras-app-root {
      position: fixed !important;
      inset: 0 !important;
      z-index: -1 !important;
      opacity: 1 !important;
      pointer-events: none !important;
    }
    #vlibras-access-wrapper {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #captionBar {
      position: fixed;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: min(85vw, 640px);
      padding: 10px 20px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      color: #FFD60A; /* amarelo alto-contraste, padrão de legendagem acessível */
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(16px, 2.8vw, 28px);
      line-height: 1.3;
      text-align: center;
      text-shadow:
        0 0 4px rgba(0,0,0,0.95),
        0 2px 6px rgba(0,0,0,0.9),
        0 0 1px #000;
      pointer-events: none;
    }
    #captionBar:empty { display: none; }
    #captionBar.hidden { display: none !important; }

    @media (max-width: 480px) {
      :root {
        --avatar-width: 150px;
        --avatar-height: 200px;
      }
      #micBtn { width: 44px; height: 44px; font-size: 18px; }
      #status { font-size: 10px; max-width: 42vw; padding: 5px 10px; }
      #controls button { font-size: 11px; padding: 8px 12px; }
      #captionBar { max-width: 90vw; font-size: clamp(14px, 4vw, 20px); }
    }
  </style>
</head>
<body>

  <div id="stage" class="stereo">
    <div class="eye" id="eyeLeft">
      <video autoplay playsinline muted></video>
      <div class="avatar-box"><canvas class="avatar-canvas"></canvas><div class="avatar-msg"></div></div>
    </div>
    <div class="eye" id="eyeRight">
      <video autoplay playsinline muted></video>
      <div class="avatar-box"><canvas class="avatar-canvas"></canvas><div class="avatar-msg"></div></div>
    </div>
  </div>

  <button id="micBtn" title="Ligar/desligar o microfone">🎤</button>
  <div id="diag"></div>
  <div id="status">Carregando câmera...</div>

  <div id="controls">
    <button id="toggleCaptionBtn" title="Ativar/desativar legenda">💬 Legenda</button>
    <button id="toggleVlibrasBtn" title="Ativar/desativar VLibras">🧏 VLibras</button>
  </div>

  <!-- Elemento invisível: o código escreve a frase aqui, seleciona o texto e
       dispara o clique que faz o widget do VLibras traduzir. -->
  <div id="vlibras-fonte" aria-hidden="true"></div>

  <div id="captionBar">Olhe para baixo para abrir o menu</div>

  <!-- Widget oficial do VLibras (cópia local em public/vlibras-app). A tradução precisa de internet. -->
  <script src="/vlibras-app/vlibras-plugin.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
